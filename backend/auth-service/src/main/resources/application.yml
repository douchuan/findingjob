server:
  port: 8001

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/findingjob_auth
    username: findingjob
    password: findingjob
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:findingjob-default-secret-key-change-in-production-2026}
  expiration: 86400

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:mock-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:mock-client-secret}
    redirect-uri: http://localhost:8001/api/auth/oauth/github/callback
  gitee:
    client-id: ${GITEE_CLIENT_ID:mock-client-id}
    client-secret: ${GITEE_CLIENT_SECRET:mock-client-secret}
    redirect-uri: http://localhost:8001/api/auth/oauth/gitee/callback
  wechat:
    client-id: ${WECHAT_CLIENT_ID:}
    client-secret: ${WECHAT_CLIENT_SECRET:}
  alipay:
    client-id: ${ALIPAY_CLIENT_ID:}
    client-secret: ${ALIPAY_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.findingjob: DEBUG
    org.springframework.security: DEBUG
