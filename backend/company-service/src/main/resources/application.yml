server:
  port: 8003

spring:
  application:
    name: company-service
  datasource:
    url: jdbc:postgresql://localhost:5432/findingjob_company
    username: findingjob
    password: findingjob
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: company
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:findingjob-default-secret-key-change-in-production-2026}

storage:
  type: ${STORAGE_TYPE:local}
  local-path: ${STORAGE_LOCAL_PATH:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.findingjob: DEBUG
