server:
  port: 8005

spring:
  application:
    name: resume-service
  datasource:
    url: jdbc:postgresql://localhost:5432/findingjob_resume
    username: findingjob
    password: findingjob
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: resume
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:findingjob-default-secret-key-change-in-production-2026}

resume:
  max-size-mb: 10
  download-expiry-hours: 168  # 7 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.findingjob: DEBUG
